name: release

on:
  push:
    tags:
      - '[0-9]+.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Blocks the release before any build work when the website changelog does not
  # already carry this tag's notes. Correctness does not rest on this job — the client
  # looks its own version up in the feed (ChangelogSelector.SelectForVersion) and shows
  # nothing when it is absent — but "nothing" means shipping a release whose update
  # dialog is silently blank, which is what this catches while it is still cheap.
  #
  # Order of operations: publish the website entry first, then push the tag. If this
  # fails, fix the site and hit "Re-run failed jobs" — the tag does not need to be
  # deleted and re-pushed.
  changelog-gate:
    name: changelog lists ${{ github.ref_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify changelog.json lists this version first
        shell: bash
        run: |
          # workflow_dispatch runs carry a branch ref, not a version — nothing to check.
          # This is a step-level early exit rather than a job-level `if:` on purpose:
          # a skipped job would take the `publish` jobs that need it down with it.
          case "$GITHUB_REF" in
            refs/tags/*) ;;
            *) echo "Not a tag ref ($GITHUB_REF) — skipping changelog check."; exit 0 ;;
          esac

          tag="${GITHUB_REF_NAME#v}"

          # Cache-buster + no-cache: an edge node still holding the previous file would
          # otherwise fake a pass (or a fail) here. Same reason UpdateService appends
          # ?v={version} on the client side.
          if ! json=$(curl -fsSL --retry 3 --retry-delay 5 -H 'Cache-Control: no-cache' \
                        "https://www.xrayui.site/changelog.json?ci=$GITHUB_RUN_ID"); then
            echo "::error::changelog.json could not be fetched — the site may be down."
            exit 1
          fi

          # Position in the feed is irrelevant — the client matches on the version name.
          entry=$(jq --arg t "$tag" '[.versions[]? | select(.version == $t)][0] // empty' <<<"$json")
          if [ -z "$entry" ]; then
            have=$(jq -r '[.versions[]?.version] | join(", ")' <<<"$json")
            echo "::error::changelog.json has no entry for '$tag' (found: $have). Publish it, then re-run this job."
            exit 1
          fi

          if ! jq -e '(.zh | length > 0) and (.en | length > 0)' <<<"$entry" >/dev/null; then
            echo "::error::The $tag entry has no zh or no en lines — the dialog would silently fall back to the other language."
            exit 1
          fi

          echo "OK: changelog.json lists $tag with both languages."

  publish:
    name: publish ${{ matrix.rid }}${{ matrix.wasdk_sc && '-wasdk' || '' }} (AOT)
    needs: changelog-gate
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        rid: [win-x64, win-arm64]
        # false = framework-dependent WinAppSDK (needs Windows App Runtime installed,
        # smaller zip; the auto-update channel tracks these). true = runtime bundled
        # into the app folder ("-wasdk" zips, no installer needed, much larger).
        wasdk_sc: [false, true]
        # The include entries below attach per-rid build parameters to every
        # rid × wasdk_sc combination. Keep rid/platform/rust_target here and the
        # variant flags as axes above — flat include entries would overwrite each
        # other instead of forming a cross product.
        include:
          # arm64 cross-compiles on the x64 windows-latest runner: NativeAOT and
          # rustc both use the ARM64 MSVC cross tools preinstalled on the image
          # (no windows-11-arm runner needed). win-x86 would follow the same
          # pattern (platform: x86, rust_target: i686-pc-windows-msvc).
          - rid: win-x64
            platform: x64
            rust_target: x86_64-pc-windows-msvc
          - rid: win-arm64
            platform: ARM64
            rust_target: aarch64-pc-windows-msvc

    env:
      # Suffix for zip/artifact names: "" or "-wasdk".
      VARIANT: ${{ matrix.wasdk_sc && '-wasdk' || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Compute version from tag
        id: ver
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          $ver = $tag -replace '^v',''
          if ($ver -notmatch '^\d+(\.\d+){0,3}$') { $ver = '0.0.0' }
          "version=$ver" | Out-File $env:GITHUB_OUTPUT -Append
          Write-Host "Resolved version: $ver (from tag $tag)"

      # No separate `dotnet restore` step: PublishAot must be set at restore time
      # for ILCompiler to be pulled in. See build.yml for details.
      - name: Publish (${{ matrix.rid }}${{ env.VARIANT }}, AOT)
        run: >
          dotnet publish XrayUI-dev.csproj
          -c Release
          -r ${{ matrix.rid }}
          -p:Platform=${{ matrix.platform }}
          -p:SelfContained=true
          -p:PublishAot=true
          -p:PublishTrimmed=true
          -p:PublishSingleFile=false
          -p:PublishReadyToRun=false
          -p:WindowsAppSDKSelfContained=${{ matrix.wasdk_sc }}
          -p:CopyOutputSymbolsToPublishDirectory=false
          -p:Version=${{ steps.ver.outputs.version }}
          -p:BuildingForCI=true

      - name: Install Rust (${{ matrix.rust_target }})
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Build Updater (${{ matrix.rust_target }})
        run: >
          cargo build --release
          --manifest-path updater-rs/Cargo.toml
          --bin xrayui-updater
          --target ${{ matrix.rust_target }}

      - name: Bundle updater into staging
        shell: pwsh
        run: |
          $publishDir = "bin/Release/net10.0-windows10.0.19041.0/${{ matrix.rid }}/publish"
          $updaterExe = "updater-rs/target/${{ matrix.rust_target }}/release/xrayui-updater.exe"
          if (-not (Test-Path $updaterExe)) {
            Write-Host "::error::Updater build did not produce $updaterExe"
            exit 1
          }
          # Cargo can't emit a dotted file name; copy to the contract filename that
          # UpdateService.cs and already-released versions expect.
          Copy-Item $updaterExe -Destination "$publishDir/XrayUI.Updater.exe" -Force
          Write-Host "Bundled XrayUI.Updater.exe (Rust) into $publishDir"

      - name: Verify AOT exe produced
        shell: pwsh
        run: |
          $publishDir = "bin/Release/net10.0-windows10.0.19041.0/${{ matrix.rid }}/publish"
          $exe = "$publishDir/XrayUI-dev.exe"
          Write-Host "Listing $publishDir :"
          if (Test-Path $publishDir) {
            Get-ChildItem -Recurse $publishDir | ForEach-Object { $_.FullName }
          } else {
            Write-Host "(publish dir does not exist)"
          }
          if (-not (Test-Path $exe)) {
            Write-Host "::error::Publish did not produce $exe"
            exit 1
          }
          Write-Host "OK: AOT exe found at $exe ($((Get-Item $exe).Length) bytes)"

      - name: Pack zip
        shell: pwsh
        run: |
          $publishDir = "bin/Release/net10.0-windows10.0.19041.0/${{ matrix.rid }}/publish"
          $zipName = "XrayUI-${{ matrix.rid }}${{ env.VARIANT }}.zip"
          Compress-Archive -Path "$publishDir/*" -DestinationPath $zipName -CompressionLevel Optimal
          Write-Host "Created $zipName ($((Get-Item $zipName).Length) bytes)"

      - name: Generate SHA256
        shell: pwsh
        run: |
          $zip = "XrayUI-${{ matrix.rid }}${{ env.VARIANT }}.zip"
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          # Standard sha256sum format: "<hash>  <filename>" (two spaces, no newline).
          [System.IO.File]::WriteAllText("$zip.sha256", "$hash  $zip", [System.Text.Encoding]::ASCII)
          Write-Host "Wrote $zip.sha256 = $hash"

      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: XrayUI-${{ matrix.rid }}${{ env.VARIANT }}
          path: XrayUI-${{ matrix.rid }}${{ env.VARIANT }}.zip*
          retention-days: 14
          if-no-files-found: error

  release:
    name: create GitHub release
    needs: publish
    runs-on: ubuntu-latest
    # Only create a Release on real tag pushes. workflow_dispatch is for testing
    # the publish flow only; download the zip artifacts from the run page to verify.
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten release files
        run: |
          mkdir -p release-files
          find artifacts \( -name '*.zip' -o -name '*.sha256' \) -exec mv {} release-files/ \;
          ls -la release-files

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          # Direct-download base for this tag's assets; asset names below are the
          # UpdateService.cs contract (XrayUI-{rid}[-wasdk].zip) — do not rename.
          DL: ${{ github.server_url }}/${{ github.repository }}/releases/download/${{ github.ref_name }}
        with:
          body: |
            ## Which one should I download

            #### Normal version (Recommended)
            - [x64 (Most common)](${{ env.DL }}/XrayUI-win-x64.zip) | [ARM64](${{ env.DL }}/XrayUI-win-arm64.zip)

            #### Self-contained WinAppSDK version (larger; use only when the normal version fails to start)
            - [x64](${{ env.DL }}/XrayUI-win-x64-wasdk.zip) | [ARM64](${{ env.DL }}/XrayUI-win-arm64-wasdk.zip)
          files: |
            release-files/*.zip
            release-files/*.sha256
          generate_release_notes: true
          fail_on_unmatched_files: true
